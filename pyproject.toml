[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroxd"
version = "0.1.0"
description = "Self-contained, from-scratch real-time anomaly/intrusion detection engine and controlled security lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.scripts]
pyroxd = "pyroxd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
